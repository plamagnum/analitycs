services:
  nginx:
    image: nginx:alpine
    container_name: analitycs_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./php/src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - analitycs_network

  php-fpm:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: analitycs_php
    volumes:
      - ./php/src:/var/www/html
      - ./uploads:/var/www/uploads
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-analitycs}
      - MYSQL_USER=${MYSQL_USER:-analitycs_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-analitycs_pass}
    depends_on:
      - mysql
    networks:
      - analitycs_network

  mysql:
    image: mysql:8.0
    container_name: analitycs_mysql
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-analitycs}
      - MYSQL_USER=${MYSQL_USER:-analitycs_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-analitycs_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - analitycs_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: analitycs_phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_USER:-analitycs_user}
      - PMA_PASSWORD=${MYSQL_PASSWORD:-analitycs_pass}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
    depends_on:
      - mysql
    networks:
      - analitycs_network

networks:
  analitycs_network:
    driver: bridge

volumes:
  mysql_data:
